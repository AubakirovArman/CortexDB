[package]
name = "cortex-sdk"
description = "Rust HTTP client SDK for CortexDB Core Alpha"
edition.workspace = true
license.workspace = true
repository = "https://github.com/AubakirovArman/CortexDB"
readme = "../../sdk/README.md"
version.workspace = true
keywords = ["cortexdb", "database", "client", "sdk", "http"]
categories = ["database", "web-programming::http-client"]
documentation = "https://docs.rs/cortex-sdk"
authors = ["CortexDB Contributors"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
async = ["dep:reqwest", "dep:tokio"]

[dependencies]
cortex-api-types = { path = "../cortex-api-types", version = "0.2.0-beta.1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"], optional = true }
ureq = { version = "2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
