[package]
name = "cortex-sdk"
description = "Blocking Rust HTTP client for CortexDB Core Alpha"
edition.workspace = true
license.workspace = true
repository = "https://github.com/AubakirovArman/CortexDB"
readme = "../../sdk/README.md"
version.workspace = true
keywords = ["cortexdb", "database", "client", "sdk", "http"]
categories = ["database", "web-programming::http-client"]
documentation = "https://docs.rs/cortex-sdk"
authors = ["CortexDB Contributors"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
cortex-api-types = { path = "../cortex-api-types", version = "0.2.0-beta.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", default-features = false }
