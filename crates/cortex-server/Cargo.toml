[package]
name = "cortex-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
accountability-receipt = [
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:sha2",
    "dep:subtle",
    "dep:zeroize",
]

[dependencies]
cortex-api-types = { path = "../cortex-api-types", version = "0.2.0-beta.2" }
cortex-aql = { path = "../cortex-aql" }
cortex-core = { path = "../cortex-core" }
cortex-crypto = { path = "../cortex-crypto" }
cortex-embed-client = { path = "../cortex-embed-client" }
cortex-engine = { path = "../cortex-engine" }
ed25519-dalek = { version = "2.1", optional = true }
getrandom = { version = "0.2", optional = true }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.5", optional = true }
zeroize = { version = "1.7", optional = true }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }
