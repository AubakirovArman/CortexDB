openapi: 3.1.0
info:
  title: CortexDB Core Alpha API
  version: 0.1.0-core-alpha
  description: 'Experimental Core Alpha HTTP API for the local single-node CortexDB
    engine. The HTTP layer is async, while the database core is a local blocking engine
    executed through a blocking task boundary.

    '
servers:
- url: http://127.0.0.1:8181
paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/compatibility:
    get:
      summary: API, SDK, storage, and migration compatibility versions
      responses:
        '200':
          description: Compatibility report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
  /v1/stats:
    get:
      summary: Storage and WAL statistics
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Storage stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /v1/validate:
    get:
      summary: Validate storage integrity
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
  /v1/cell:
    get:
      summary: Read one cell
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Cell lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellLookupResponse'
        '400': &id001
          description: Bad Request — missing parameters, invalid AQL, or malformed
            payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': &id003
          description: Not Found — cell or job does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': &id002
          description: Internal Error — database operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Put one cell
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Commit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutCellResponse'
        '400': *id001
        '500': *id002
    delete:
      summary: Tombstone one cell
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Commit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutCellResponse'
        '400': *id001
        '404': *id003
        '500': *id002
  /v1/admin/auth/principal:
    post:
      summary: Upsert a local auth policy principal
      description: Admin-only local policy-store mutation. Requires CORTEXDB_AUTH_POLICY_STORE_FILE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPolicyPrincipalRequest'
      responses:
        '200':
          description: Policy mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPolicyMutationResponse'
        '400': *id001
        '401': &id004
          description: Unauthorized — missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': &id005
          description: Forbidden — authenticated principal lacks route role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': *id002
    delete:
      summary: Disable a local auth policy principal
      description: Admin-only local policy-store mutation. Requires CORTEXDB_AUTH_POLICY_STORE_FILE.
      parameters:
      - name: principal_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policy mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPolicyMutationResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '404': *id003
        '500': *id002
  /v1/admin/auth/policy/rollback:
    post:
      summary: Restore the previous local auth policy-store snapshot
      description: Admin-only rollback for the previous local policy-store mutation.
      responses:
        '200':
          description: Policy mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPolicyMutationResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '404': *id003
        '500': *id002
  /v1/admin/auth/policies:
    get:
      summary: List redacted local auth policy principals
      description: Admin-only policy-store review. Raw bearer tokens are never returned.
      responses:
        '200':
          description: Redacted policy list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPolicyListResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '500': *id002
  /v1/admin/auth/scope/grant:
    post:
      summary: Grant a scope to an existing AgentView
      description: Admin-only AgentView scope mutation. AgentView remains the source of scope permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthScopeMutationRequest'
      responses:
        '200':
          description: Agent scope mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthScopeMutationResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '404': *id003
        '500': *id002
  /v1/admin/auth/scope/revoke:
    post:
      summary: Revoke a scope from an existing AgentView
      description: Admin-only AgentView scope mutation. AgentView remains the source of scope permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthScopeMutationRequest'
      responses:
        '200':
          description: Agent scope mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthScopeMutationResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '404': *id003
        '500': *id002
  /v1/admin/search/hnsw/no-fallback-profile:
    get:
      summary: Read the persisted HNSW no-fallback rollout profile
      description: Admin-only operator profile. It is disabled unless configured and does not remove exact fallback globally.
      responses:
        '200':
          description: Current no-fallback profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnswNoFallbackProfileResponse'
        '401': *id004
        '403': *id005
        '500': *id002
    put:
      summary: Store the HNSW no-fallback rollout profile
      description: Admin-only operator profile used when requests opt into no_fallback_profile=active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HnswNoFallbackProfileRequest'
      responses:
        '200':
          description: Stored no-fallback profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnswNoFallbackProfileResponse'
        '400': *id001
        '401': *id004
        '403': *id005
        '500': *id002
    delete:
      summary: Clear the HNSW no-fallback rollout profile
      responses:
        '200':
          description: Cleared no-fallback profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HnswNoFallbackProfileResponse'
        '401': *id004
        '403': *id005
        '500': *id002
  /v1/flush:
    post:
      summary: Checkpoint current changes
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Checkpoint result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
  /v1/compact:
    post:
      summary: Compact visible snapshot
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Compaction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
  /v1/aql:
    post:
      summary: Run AQL retrieve or explain retrieve
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - name: format
        in: query
        required: false
        description: Output format. Defaults to JSON; prompt and markdown are stable agent export modes.
        schema:
          type: string
          enum:
          - json
          - prompt
          - markdown
          default: json
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Retrieved cells
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AqlResponse'
        '400': *id001
        '500': *id002
  /v1/search:
    post:
      summary: Keyword or vector search
      description: |
        **Alpha/Experimental.** Search quality, HNSW graph behavior, and ANN fallback
        semantics are under active development. Exact vector scan is the safe default;
        ANN may fall back to exact when the graph is empty or under-returning;
        fallback and SLO guardrails are reported in ann_report.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - keyword
          - vector
          - hybrid
          - auto
      - name: algorithm
        in: query
        description: Vector search algorithm. `ann` may fall back to exact scan when
          no graph is available.
        schema:
          type: string
          enum:
          - ann
          - exact
      - name: q
        in: query
        schema:
          type: string
      - name: vector
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - name: fallback
        in: query
        description: Enable ANN fallback to exact scan when ANN is unavailable or underperforming.
        schema:
          type: boolean
      - name: min_recall
        in: query
        description: Minimum acceptable ANN recall (fraction like 0.75 or percent like 75).
        schema:
          type: string
      - name: fallback_scan_cap
        in: query
        description: Max number of candidates exact scan may use when fallback is needed.
        schema:
          type: integer
          minimum: 0
      - name: max_visited_candidates
        in: query
        description: Maximum number of HNSW nodes to visit before forcing ANN fallback.
        schema:
          type: integer
          minimum: 0
      - name: require_slo
        in: query
        description: Enable strict ANN/HNSW SLO reporting. Responses include production_safe=false when recall, graph, fallback, or visit-budget guardrails are violated.
        schema:
          type: boolean
      - name: no_fallback_rollout
        in: query
        description: Explicitly evaluate the selected ANN profile for fallback-free HNSW serving. This does not disable global exact fallback by itself.
        schema:
          type: boolean
      - name: no_fallback_min_recall
        in: query
        description: Optional fallback-free rollout recall threshold. Requires no_fallback_rollout=true.
        schema:
          type: string
      - name: no_fallback_profile
        in: query
        description: Use the persisted operator-managed rollout profile when set to active or true. Cannot be combined with no_fallback_rollout.
        schema:
          type: string
          enum:
          - active
          - 'true'
          - 'false'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': *id001
        '500': *id002
  /v1/search/explain:
    post:
      summary: Explain search scores
      description: |
        Returns tokenized query terms and a per-cell score breakdown.
        Useful for debugging why a cell ranked where it did.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - keyword
          - vector
          - hybrid
      - name: q
        in: query
        schema:
          type: string
      - name: vector
        in: query
        description: Required for mode=hybrid; optional alternative to q for mode=vector.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Search explain results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchExplainResponse'
        '400': *id001
        '500': *id002
  /v1/search/ann-evaluate:
    post:
      summary: Compare persisted ANN search against exact vector scan
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - name: vector
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - name: fallback
        in: query
        description: Enable ANN fallback to exact scan when ANN is unavailable or underperforming.
        schema:
          type: boolean
      - name: min_recall
        in: query
        description: Minimum acceptable ANN recall (fraction like 0.75 or percent like 75).
        schema:
          type: string
      - name: fallback_scan_cap
        in: query
        description: Max number of candidates exact scan may use when fallback is needed.
        schema:
          type: integer
          minimum: 0
      - name: max_visited_candidates
        in: query
        description: Maximum number of HNSW nodes to visit before forcing ANN fallback.
        schema:
          type: integer
          minimum: 0
      - name: require_slo
        in: query
        description: Enable strict ANN/HNSW SLO reporting. Responses include production_safe=false when recall, graph, fallback, or visit-budget guardrails are violated.
        schema:
          type: boolean
      - name: no_fallback_rollout
        in: query
        description: Explicitly evaluate the selected ANN profile for fallback-free HNSW serving. This does not disable global exact fallback by itself.
        schema:
          type: boolean
      - name: no_fallback_min_recall
        in: query
        description: Optional fallback-free rollout recall threshold. Requires no_fallback_rollout=true.
        schema:
          type: string
      - name: no_fallback_profile
        in: query
        description: Use the persisted operator-managed rollout profile when set to active or true. Cannot be combined with no_fallback_rollout.
        schema:
          type: string
          enum:
          - active
          - 'true'
          - 'false'
      responses:
        '200':
          description: ANN recall evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnEvaluationResponse'
        '400': *id001
        '500': *id002
  /v1/cluster/status:
    get:
      summary: Node and replication status
      description: Returns cluster layout currently known to this node.
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/context:
    post:
      summary: Build a ContextPack from AQL
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - prompt
          - markdown
          default: json
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: ContextPack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextPackResponse'
            text/plain:
              schema:
                type: string
                description: Stable agent prompt export when `format=prompt`.
            text/markdown:
              schema:
                type: string
                description: Stable Markdown export when `format=markdown`.
        '400': *id001
        '500': *id002
  /v1/context/trace:
    post:
      summary: Explain retrieve to ContextPack to verify pipeline
      description: |
        Builds a ContextPack and returns a trace of the retrieve, pack, and
        optional verify stages. The body can be either plain retrieve AQL or a
        JSON object with `retrieve_aql` and optional `verify_aql`.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: RETRIEVE CONTEXT AQL statement.
          application/json:
            schema:
              $ref: '#/components/schemas/ContextTraceRequest'
      responses:
        '200':
          description: Context pipeline trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextTraceResponse'
        '400': *id001
        '403': *id005
        '500': *id002
  /v1/inference:
    post:
      summary: Run deterministic LLM inference test-double
      description: |
        Opt-in contract endpoint for future built-in LLM inference work. It is
        disabled by default unless `CORTEXDB_LLM_TEST_DOUBLE=true` is set,
        accepts only provider `test_double` with model `deterministic-echo-v1`,
        consumes explicit ContextPack input, and never calls an external model
        provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmInferenceRequest'
      responses:
        '200':
          description: Deterministic test-double inference response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmInferenceResponse'
        '400': *id001
        '403': *id005
        '500': *id002
  /v1/remember:
    post:
      summary: Execute AQL REMEMBER
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Remember result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RememberResponse'
        '400': *id001
        '500': *id002
  /v1/forget:
    post:
      summary: Forget (tombstone) a cell
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Forget result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutCellResponse'
        '400': *id001
        '500': *id002
  /v1/verify:
    post:
      summary: Execute AQL VERIFY FACT
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReportResponse'
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '400': *id001
        '500': *id002
  /v1/ingest/text:
    post:
      summary: Ingest raw text chunks
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Source'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400': *id001
        '500': *id002
  /v1/ingest/json:
    post:
      summary: Ingest flattened JSON facts
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Source'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400': *id001
        '500': *id002
  /v1/ingest/csv:
    post:
      summary: Ingest CSV rows
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Source'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400': *id001
        '500': *id002
  /v1/ingest/jobs:
    get:
      summary: List persisted ingestion jobs
      description: Lists atomically persisted local ingestion job records. Jobs left running across a database restart are requeued as queued with a recovery message.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: List of ingestion jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestionProgress'
        '500': *id002
  /v1/ingest/jobs/{job_id}:
    get:
      summary: Read persisted ingestion job progress
      description: Returns durable local progress, including completed item count, failed item count, last cell id, retry count, and restart recovery message when applicable.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
      responses:
        '200':
          description: Ingestion job progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionProgress'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': *id002
    delete:
      summary: Delete or cancel an ingestion job
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': *id002
  /v1/ingest/jobs/{job_id}/retry:
    post:
      summary: Retry a failed ingestion job
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
      responses:
        '200':
          description: Retried job progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionProgress'
        '400':
          description: Job not in failed state or max retries exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': *id002
  /v1/ingest/jobs/{job_id}/cancel:
    post:
      summary: Cancel a queued or running ingestion job
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
      responses:
        '200':
          description: Cancelled job progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionProgress'
        '400':
          description: Job not in queued or running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': *id002
  /get:
    get:
      summary: Legacy cell read
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Cell lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /put:
    post:
      summary: Legacy cell write
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Commit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutCellResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /flush:
    post:
      summary: Legacy checkpoint flush
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Checkpoint result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tombstone:
    post:
      summary: Legacy cell tombstone
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Commit acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutCellResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/metrics:
    get:
      summary: Aggregated database metrics
      description: |
        Returns a unified view of storage, WAL, MemTable, and ANN/HNSW metrics.
        This is the recommended observability entry point for monitoring and dashboards.
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Aggregated metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/ann/metrics:
    get:
      summary: ANN/HNSW graph metrics
      parameters:
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: ANN metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnMetricsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Tenant:
      name: tenant
      in: query
      required: false
      description: Optional database realm. Omit or use `default` for the root database.
      schema:
        type: string
    CellId:
      name: cell_id
      in: query
      required: true
      schema:
        type: integer
        format: uint64
    Scope:
      name: scope
      in: query
      required: true
      schema:
        type: string
    Source:
      name: source
      in: query
      required: false
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - version
      - server_version
      properties:
        status:
          type: string
        version:
          type: string
        server_version:
          type: string
    CompatibilityResponse:
      type: object
      required:
      - schema_version
      - api
      - sdk
      - storage_formats
      - migration
      properties:
        schema_version:
          type: string
          example: cortexdb.compatibility.v1
        api:
          $ref: '#/components/schemas/ApiCompatibility'
        sdk:
          $ref: '#/components/schemas/SdkCompatibility'
        storage_formats:
          type: array
          items:
            $ref: '#/components/schemas/StorageFormatCompatibility'
        migration:
          $ref: '#/components/schemas/MigrationCompatibility'
    ApiCompatibility:
      type: object
      required:
      - version
      - contract
      - gate
      properties:
        version:
          type: string
        contract:
          type: string
        gate:
          type: string
    SdkCompatibility:
      type: object
      required:
      - contract
      - workspace_version
      - gate
      properties:
        contract:
          type: string
        workspace_version:
          type: string
        gate:
          type: string
    StorageFormatCompatibility:
      type: object
      required:
      - name
      - extension
      - current_magic
      - current_version
      - legacy_magics
      - compatibility_rule
      properties:
        name:
          type: string
        extension:
          type: string
        current_magic:
          type: string
        current_version:
          type: integer
          format: uint32
        legacy_magics:
          type: array
          items:
            type: string
        compatibility_rule:
          type: string
    MigrationCompatibility:
      type: object
      required:
      - matrix_schema_version
      - release
      - current_release
      - gate
      properties:
        matrix_schema_version:
          type: integer
          format: uint64
        release:
          type: string
        current_release:
          type: string
        gate:
          type: string
    Cell:
      type: object
      required:
      - cell_id
      - payload
      properties:
        cell_id:
          type: integer
          format: uint64
        payload:
          type: string
    CellLookupResponse:
      type: object
      required:
      - cell
      properties:
        cell:
          anyOf:
          - $ref: '#/components/schemas/Cell'
          - type: 'null'
    PutCellResponse:
      type: object
      required:
      - seq
      - cell_id
      properties:
        seq:
          type: integer
          format: uint64
        cell_id:
          type: integer
          format: uint64
    AuthPolicyPrincipalRequest:
      type: object
      additionalProperties: false
      required:
      - principal_id
      - token
      - role
      properties:
        principal_id:
          type: string
        token:
          type: string
        role:
          type: string
          enum:
          - admin
          - data
        agent_id:
          type: integer
          format: uint64
          minimum: 1
        disabled:
          type: boolean
        request_quota_per_minute:
          type: integer
          format: uint64
          minimum: 1
        body_quota_bytes_per_minute:
          type: integer
          format: uint64
          minimum: 1
        queue_quota:
          type: integer
          format: uint64
          minimum: 1
        context_budget_tokens:
          type: integer
          format: uint32
          minimum: 1
        capabilities:
          type: array
          items:
            type: string
            enum:
            - admin
            - aql
            - context
            - delete
            - ingest
            - inference
            - memory
            - metrics
            - read
            - search
            - verify
            - write
          minimum: 1
        tenants:
          type: array
          items:
            type: string
          minimum: 1
    AuthPolicyMutationResponse:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - action
      - principal_id
      - active_principals
      - disabled_principals
      - rollback_available
      properties:
        schema_version:
          type: string
          enum:
          - cortexdb.auth_policy_mutation.v1
        action:
          type: string
          enum:
          - upsert_principal
          - disable_principal
          - rollback_policy
        principal_id:
          anyOf:
          - type: string
          - type: 'null'
        active_principals:
          type: integer
        disabled_principals:
          type: integer
        rollback_available:
          type: boolean
    AuthPolicyListPrincipal:
      type: object
      additionalProperties: false
      required:
      - principal_id
      - role
      - agent_id
      - disabled
      - request_quota_per_minute
      - body_quota_bytes_per_minute
      - queue_quota
      - context_budget_tokens
      - capabilities
      - tenants
      - token_present
      - token_fingerprint
      properties:
        principal_id:
          type: string
        role:
          type: string
          enum:
          - admin
          - data
        agent_id:
          anyOf:
          - type: integer
            format: uint64
            minimum: 1
          - type: 'null'
        disabled:
          type: boolean
        request_quota_per_minute:
          anyOf:
          - type: integer
            format: uint64
            minimum: 1
          - type: 'null'
        body_quota_bytes_per_minute:
          anyOf:
          - type: integer
            format: uint64
            minimum: 1
          - type: 'null'
        queue_quota:
          anyOf:
          - type: integer
            format: uint64
            minimum: 1
          - type: 'null'
        context_budget_tokens:
          anyOf:
          - type: integer
            format: uint32
            minimum: 1
          - type: 'null'
        capabilities:
          type: array
          items:
            type: string
        tenants:
          type: array
          items:
            type: string
        token_present:
          type: boolean
        token_fingerprint:
          type: string
    AuthPolicyListResponse:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - supported_roles
      - principal_count
      - active_principals
      - disabled_principals
      - principals
      - token_redaction
      properties:
        schema_version:
          type: string
          enum:
          - cortexdb.auth_policy_list.v1
        supported_roles:
          type: array
          items:
            type: string
            enum:
            - admin
            - data
        principal_count:
          type: integer
        active_principals:
          type: integer
        disabled_principals:
          type: integer
        principals:
          type: array
          items:
            $ref: '#/components/schemas/AuthPolicyListPrincipal'
        token_redaction:
          type: string
    AuthScopeMutationRequest:
      type: object
      additionalProperties: false
      required:
      - agent_id
      - scope
      - access
      properties:
        agent_id:
          type: integer
          format: uint64
          minimum: 1
        scope:
          type: string
          minLength: 1
        access:
          type: string
          enum:
          - read
          - write
          - read_write
    AuthScopeMutationResponse:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - action
      - agent_id
      - scope
      - access
      - readable_scope_count
      - writable_scope_count
      properties:
        schema_version:
          type: string
          enum:
          - cortexdb.auth_scope_mutation.v1
        action:
          type: string
          enum:
          - grant_scope
          - revoke_scope
        agent_id:
          type: integer
          format: uint64
        scope:
          type: string
        access:
          type: string
          enum:
          - read
          - write
          - read_write
        readable_scope_count:
          type: integer
        writable_scope_count:
          type: integer
    HnswNoFallbackProfileRequest:
      type: object
      additionalProperties: false
      required:
      - rollout_enabled
      properties:
        rollout_enabled:
          type: boolean
        min_recall_q16:
          type: integer
          minimum: 0
          maximum: 65535
        require_upper_layers:
          type: boolean
    HnswNoFallbackProfileResponse:
      type: object
      additionalProperties: false
      required:
      - configured
      - rollout_enabled
      - min_recall_q16
      - require_upper_layers
      properties:
        configured:
          type: boolean
        rollout_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
        min_recall_q16:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 65535
          - type: 'null'
        require_upper_layers:
          anyOf:
          - type: boolean
          - type: 'null'
    CheckpointResponse:
      type: object
      required:
      - checkpoint_seq
      - cells_flushed
      properties:
        checkpoint_seq:
          type: integer
          format: uint64
        cells_flushed:
          type: integer
    StatsResponse:
      type: object
      additionalProperties: false
      required:
      - current_seq
      - checkpoint_seq
      - live_segments
      - retired_segments
      - memtable_cells
      - memtable_versions
      - memtable_payload_bytes
      - estimated_memtable_bytes
      - estimated_index_bytes
      - estimated_context_pack_bytes
      - estimated_total_memory_bytes
      - live_segment_bytes
      - retired_segment_bytes
      - total_segment_bytes
      - durable_storage_bytes
      - live_segment_payload_bytes
      - logical_payload_bytes
      - space_amplification_q16
      - write_amplification_q16
      - compaction_pressure_q16
      - wal_size_bytes
      - wal_writer_records
      - wal_writer_bytes
      - wal_writer_fsyncs
      - wal_writer_batches
      properties:
        current_seq:
          type: integer
          format: uint64
        checkpoint_seq:
          type: integer
          format: uint64
        live_segments:
          type: integer
        retired_segments:
          type: integer
        memtable_cells:
          type: integer
        memtable_versions:
          type: integer
        memtable_payload_bytes:
          type: integer
        estimated_memtable_bytes:
          type: integer
        estimated_index_bytes:
          type: integer
        estimated_context_pack_bytes:
          type: integer
        estimated_total_memory_bytes:
          type: integer
        live_segment_bytes:
          type: integer
          format: uint64
        retired_segment_bytes:
          type: integer
          format: uint64
        total_segment_bytes:
          type: integer
          format: uint64
        durable_storage_bytes:
          type: integer
          format: uint64
        live_segment_payload_bytes:
          type: integer
          format: uint64
        logical_payload_bytes:
          type: integer
          format: uint64
        space_amplification_q16:
          type: integer
          format: uint32
        write_amplification_q16:
          type: integer
          format: uint32
        compaction_pressure_q16:
          type: integer
          format: uint32
        wal_size_bytes:
          type: integer
          format: uint64
        wal_writer_records:
          type: integer
          format: uint64
        wal_writer_bytes:
          type: integer
          format: uint64
        wal_writer_fsyncs:
          type: integer
          format: uint64
        wal_writer_batches:
          type: integer
          format: uint64
    ValidationResponse:
      type: object
      required:
      - ok
      - manifest_ok
      - wal_ok
      - errors
      properties:
        ok:
          type: boolean
        manifest_ok:
          type: boolean
        wal_ok:
          type: boolean
        live_segments_checked:
          type: integer
        bitmap_indexes_checked:
          type: integer
        lexical_indexes_checked:
          type: integer
        vector_indexes_checked:
          type: integer
        hnsw_graphs_checked:
          type: integer
        cells_checked:
          type: integer
        wal_records_checked:
          type: integer
          format: uint64
        wal_safe_truncate_offset:
          type: integer
          format: uint64
        errors:
          type: array
          items:
            type: string
    ClusterNodeResponse:
      type: object
      required:
      - id
      - address
      properties:
        id:
          type: integer
          format: uint64
        address:
          type: string
    ClusterStatusResponse:
      type: object
      required:
      - local_node
      - nodes
      - replication_factor
      - distributed_enabled
      properties:
        local_node:
          type: integer
          format: uint64
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterNodeResponse'
        replication_factor:
          type: integer
        distributed_enabled:
          type: boolean
    AqlResponse:
      type: object
      required:
      - cells
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
        explain:
          $ref: '#/components/schemas/AqlExplainResponse'
    AqlExplainFilter:
      type: object
      required:
      - kind
      - expression
      properties:
        kind:
          type: string
          enum:
          - policy
          - liveness
          - where
        expression:
          type: string
    AqlCandidateCounts:
      type: object
      required:
      - universe
      - agent_allowed
      - live
      - after_bitmap
      - after_quality
      - returned_limit
      properties:
        universe:
          type: integer
          minimum: 0
        agent_allowed:
          type: integer
          minimum: 0
        live:
          type: integer
          minimum: 0
        after_bitmap:
          type: integer
          minimum: 0
        after_quality:
          type: integer
          minimum: 0
        returned_limit:
          type: integer
          minimum: 0
    AqlExplainResponse:
      type: object
      required:
      - task
      - brain_id
      - selected_mode
      - bitmap_plan
      - bitmap_ops
      - filters
      - candidate_counts
      - candidate_limit
      - budget_tokens
      - citations_required
      properties:
        task:
          type: string
        brain_id:
          type: integer
          minimum: 1
        selected_mode:
          type: string
          enum:
          - fast
          - balanced
          - semantic
          - audit
        bitmap_plan:
          type: string
        bitmap_ops:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AqlExplainFilter'
        candidate_counts:
          $ref: '#/components/schemas/AqlCandidateCounts'
        candidate_limit:
          type: integer
          minimum: 0
        budget_tokens:
          type: integer
          minimum: 0
        citations_required:
          type: boolean
    SearchRoutingDecision:
      type: object
      required:
      - requested_mode
      - selected_strategy
      - reason
      - text_available
      - vector_available
      properties:
        requested_mode:
          type: string
        selected_strategy:
          type: string
          enum:
          - keyword
          - vector_exact
          - vector_ann
          - hybrid
        reason:
          type: string
        text_available:
          type: boolean
        vector_available:
          type: boolean
    SearchResponse:
      type: object
      required:
      - search_mode
      - ann_report
      - results
      properties:
        search_mode:
          type: string
          enum:
          - keyword
          - vector_exact
          - vector_ann
          - hybrid
        routing:
          anyOf:
          - $ref: '#/components/schemas/SearchRoutingDecision'
          - type: 'null'
        rerank:
          type: string
          enum:
          - weighted
          description: Present when request query parameter rerank=weighted enabled weighted reranking.
        ann_report:
          anyOf:
          - $ref: '#/components/schemas/AnnSearchReport'
          - type: 'null'
        no_fallback_decision:
          anyOf:
          - $ref: '#/components/schemas/AnnNoFallbackDecision'
          - type: 'null'
        results:
          type: array
          items:
            type: object
            required:
            - cell_id
            - score
            - lexical_score
            - vector_score
            - payload
            properties:
              cell_id:
                type: integer
                format: uint64
              score:
                type: integer
                format: uint64
              lexical_score:
                type: integer
                format: uint64
              vector_score:
                type: integer
                format: uint64
              payload:
                type: string
    AnnSearchReport:
      type: object
      required:
      - path
      - fallback_reason
      - fallback_performed
      - requested_limit
      - allowed_candidates
      - graph_nodes
      - returned_candidates
      - visited_candidates
      - recall_q16
      - min_recall_q16
      - hnsw_max_neighbors
      - hnsw_ef_search
      - hnsw_ef_construction
      - hnsw_layer_count
      - upper_graph_edges
      - require_slo
      - production_safe
      - slo_violations
      properties:
        path:
          type: string
          enum:
          - hnsw_graph
          - exact_fallback
        fallback_reason:
          anyOf:
          - type: string
            enum:
            - empty_graph
            - invalid_graph
            - stale_graph
            - insufficient_results
            - low_recall
            - visit_budget_exceeded
            - no_persisted_segments
            - uncheckpointed_changes
            - hnsw_disabled
          - type: 'null'
        fallback_performed:
          type: boolean
        requested_limit:
          type: integer
        allowed_candidates:
          type: integer
        graph_nodes:
          type: integer
        returned_candidates:
          type: integer
        visited_candidates:
          type: integer
          minimum: 0
        max_visited_candidates:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        recall_q16:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 65535
          - type: 'null'
        min_recall_q16:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 65535
          - type: 'null'
        hnsw_max_neighbors:
          type: integer
          minimum: 0
        hnsw_ef_search:
          type: integer
          minimum: 0
        hnsw_ef_construction:
          type: integer
          minimum: 0
          description: HNSW construction beam used when the persisted graph was built.
        hnsw_layer_count:
          type: integer
          minimum: 1
        upper_graph_edges:
          type: integer
          minimum: 0
        require_slo:
          type: boolean
        production_safe:
          type: boolean
        slo_violations:
          type: array
          items:
            type: string
            enum:
            - empty_graph
            - invalid_graph
            - insufficient_results
            - low_recall
            - visit_budget_exceeded
            - no_persisted_segments
            - uncheckpointed_changes
            - hnsw_disabled
            - recall_below_minimum
            - weak_multi_layer_topology
    AnnNoFallbackDecision:
      type: object
      required:
      - allowed
      - reasons
      properties:
        allowed:
          type: boolean
          description: True only when the explicit no-fallback rollout policy allows this ANN report.
        reasons:
          type: array
          items:
            type: string
            enum:
            - rollout_disabled
            - fallback_enabled
            - slo_not_required
            - not_hnsw_graph_path
            - fallback_occurred
            - fallback_reason_present
            - report_not_production_safe
            - slo_violations_present
            - empty_graph
            - no_eligible_candidates
            - no_results
            - weak_multi_layer_topology
            - recall_missing
            - recall_below_minimum
            - search_policy_below_rollout_minimum
    AnnEvaluationResponse:
      type: object
      required:
      - available
      - reason
      - ann_report
      - exact_top_k
      - ann_top_k
      - overlap_count
      - recall_q16
      properties:
        available:
          type: boolean
        reason:
          anyOf:
          - type: string
            enum:
            - requires_persisted_checkpoint_without_wal_tail
          - type: 'null'
        ann_report:
          anyOf:
          - $ref: '#/components/schemas/AnnSearchReport'
          - type: 'null'
        no_fallback_decision:
          anyOf:
          - $ref: '#/components/schemas/AnnNoFallbackDecision'
          - type: 'null'
        exact_top_k:
          type: array
          items:
            type: integer
        ann_top_k:
          type: array
          items:
            type: integer
        overlap_count:
          type: integer
        recall_q16:
          type: integer
          minimum: 0
          maximum: 65535
    ContextPackResponse:
      type: object
      required:
      - schema_version
      - token_budget_tokens
      - estimated_tokens
      - truncated
      - citations_required
      - answerability_q16
      - conflict_visibility_q16
      - visible_conflict_count
      - cells
      - anomalies
      properties:
        schema_version:
          type: string
          enum:
          - context_pack.v1
        token_budget_tokens:
          type: integer
          minimum: 0
        estimated_tokens:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        citations_required:
          type: boolean
        answerability_q16:
          type: integer
          minimum: 0
          maximum: 65535
        conflict_visibility_q16:
          type: integer
          minimum: 0
          maximum: 65535
        visible_conflict_count:
          type: integer
          minimum: 0
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ContextPackCellResponse'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/ContextPackAnomalyResponse'
    ContextPackCellResponse:
      type: object
      required:
      - cell_id
      - estimated_tokens
      - citation
      - payload_text
      - explain
      - source_ref
      - provenance
      - access_decision
      properties:
        cell_id:
          type: integer
          format: uint64
        estimated_tokens:
          type: integer
          minimum: 0
        citation:
          anyOf:
          - type: string
          - type: 'null'
        payload_text:
          type: string
        explain:
          anyOf:
          - $ref: '#/components/schemas/ContextPackExplainResponse'
