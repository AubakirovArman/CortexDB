groups:
  - name: cortexdb-core-alpha
    rules:
      - alert: CortexDbWalCheckpointLag
        expr: cortexdb_current_seq - cortexdb_checkpoint_seq > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CortexDB checkpoint lag is growing
          description: current_seq is more than 1000 commits ahead of checkpoint_seq.

      - alert: CortexDbWalGrowth
        expr: cortexdb_wal_size_bytes > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CortexDB WAL is larger than 1GiB
          description: Check checkpoint and compact health before WAL recovery cost grows.

      - alert: CortexDbAnnGraphUnavailable
        expr: cortexdb_ann_graph_nodes == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: CortexDB ANN graph has no persisted nodes
          description: Exact vector fallback remains correct; checkpoint/compact may be needed for ANN evidence.

      - alert: CortexDbActorQueuePressure
        expr: cortexdb_actor_queue_capacity > 0 and (cortexdb_actor_queue_depth / cortexdb_actor_queue_capacity) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: CortexDB actor queue is near capacity
          description: Actor queue saturation is above 80%; callers may soon receive database_busy responses.

      - alert: CortexDbActorQueueWaitP95High
        expr: cortexdb_actor_queue_wait_p95_ms > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: CortexDB actor queue wait p95 is high
          description: Requests are waiting before engine execution; reduce caller concurrency or inspect queue saturation.

      - alert: CortexDbDatabaseBusy
        expr: increase(cortexdb_request_rejected[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: CortexDB rejected requests due to pressure
          description: database_busy/rate-limit rejections were observed in the last five minutes.

      - alert: CortexDbOperationalErrorRateHigh
        expr: (increase(cortexdb_request_rejected[5m]) + increase(cortexdb_validation_failures[5m])) / clamp_min(increase(cortexdb_request_count[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CortexDB operational error rate is elevated
          description: More than 5% of recent requests were rejected or accompanied by validation failures.

      - alert: CortexDbRateLimitSpike
        expr: increase(cortexdb_principal_quota_requests_rejected[5m]) + increase(cortexdb_principal_quota_body_bytes_rejected[5m]) + increase(cortexdb_principal_quota_queue_rejected[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: CortexDB rate-limit or quota rejection spike
          description: Per-principal request, body-size, or queue quota rejected work in the last five minutes.

      - alert: CortexDbBackupStale
        expr: cortexdb_backup_latest_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CortexDB latest backup evidence is stale
          description: The newest local backup evidence is older than 24 hours; run backup validation before release promotion.

      - alert: CortexDbBackupEvidenceMissing
        expr: cortexdb_backup_latest_age_seconds < 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: CortexDB backup age evidence is unavailable
          description: No local backup evidence path was found; set CORTEXDB_BACKUP_ROOT or create a backup evidence directory.

      - alert: CortexDbAnnFallbackRate
        expr: increase(cortexdb_ann_search_requests[5m]) > 0 and (increase(cortexdb_ann_fallbacks[5m]) / increase(cortexdb_ann_search_requests[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CortexDB ANN fallback rate is elevated
          description: More than 10% of ANN-capable searches reported exact/fallback behavior.

      - alert: CortexDbAnnNoFallbackBlocked
        expr: increase(cortexdb_ann_no_fallback_blocked[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: CortexDB no-fallback ANN rollout was blocked
          description: A fallback-free rollout decision was denied by guardrails; inspect no_fallback_decision reasons before retrying.

      - alert: CortexDbAnnSearchLatencyP99High
        expr: histogram_quantile(0.99, sum(rate(cortexdb_ann_search_latency_ms_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CortexDB ANN search p99 latency is high
          description: ANN-capable search p99 is above 1000ms; keep fallback-free rollout disabled until latency stabilizes.

      - alert: CortexDbValidationFailures
        expr: increase(cortexdb_validation_failures[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: CortexDB validation reported storage errors
          description: At least one /v1/validate probe returned errors; inspect validation output before continuing writes.
