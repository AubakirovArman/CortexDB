global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cortexdb
    metrics_path: /v1/metrics
    params:
      format:
        - prometheus
    static_configs:
      - targets:
          - 127.0.0.1:18080
    # Optional when CortexDB auth is enabled. Keep this file outside git.
    # authorization:
    #   credentials_file: /etc/cortexdb/metrics-token

rule_files:
  - alerts.yml
