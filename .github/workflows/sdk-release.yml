name: SDK Release

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cortex-sdk/**"
      - "mk/core-contracts.mk"
      - "mk/phony.mk"
      - "mk/vars-core.mk"
      - "scripts/sdk_public_registry_smoke.py"
      - "scripts/sdk_productization_check.py"
      - "sdk/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/sdk-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cortex-sdk/**"
      - "mk/core-contracts.mk"
      - "mk/phony.mk"
      - "mk/vars-core.mk"
      - "scripts/sdk_public_registry_smoke.py"
      - "scripts/sdk_productization_check.py"
      - "sdk/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to PyPI, npm, and crates.io"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: SDK package preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip setuptools wheel build

      # SDK contract smoke tests
      - run: cargo build --release -p cortex-server
      - run: python3 scripts/check_sdk_deprecation_policy.py
      - run: python3 scripts/check_sdk_release_contract.py
      - run: python3 scripts/check_sdk_contract.py

      # Package dry-run checks
      - name: Rust shared API types crates.io dry-run
        run: cargo publish -p cortex-api-types --dry-run
      - name: Rust SDK crates.io dry-run after API types publication
        if: ${{ vars.CORTEX_API_TYPES_PUBLISHED == '1' }}
        run: cargo publish -p cortexdb-sdk --dry-run
      - name: Python wheel dry-run
        run: python -m build sdk/python --wheel --outdir dist/python
      - name: TypeScript npm pack dry-run
        run: npm pack --dry-run
        working-directory: sdk/typescript
      - name: SDK examples artifact
        run: make sdk-release-artifacts-check

      # Existing publish check script
      - run: ./sdk/publish/check.sh
      - name: Public registry install smoke
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: make sdk-public-registry-smoke

      - name: Upload SDK examples artifact
        uses: actions/upload-artifact@v7
        with:
          name: cortexdb-sdk-examples
          path: |
            target/sdk-release-artifacts/*.tar.gz
            target/sdk-release-artifacts/*.sha256
            target/sdk-release-artifacts/report.json

  publish:
    name: Publish SDK packages
    needs: preflight
    runs-on: ubuntu-latest
    environment: sdk-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: python3 scripts/check_sdk_release_contract.py --enforce-github-ref
      - name: Verify registry credentials
        run: |
          test -n "${PYPI_API_TOKEN}"
          test -n "${NODE_AUTH_TOKEN}"
          test -n "${CARGO_REGISTRY_TOKEN}"
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: python -m pip install --upgrade pip setuptools wheel build
      - run: python -m build sdk/python --outdir dist/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          password: ${{ secrets.PYPI_API_TOKEN }}
      - run: npm publish --access public --provenance
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish Rust API types crate
        run: cargo publish -p cortex-api-types --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish Rust SDK crate
        run: cargo publish -p cortexdb-sdk --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
