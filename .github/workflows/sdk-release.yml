name: SDK Release

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cortex-sdk/**"
      - "sdk/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/sdk-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cortex-sdk/**"
      - "sdk/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to PyPI, npm, and crates.io"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: SDK package preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./sdk/publish/check.sh

  publish:
    name: Publish SDK packages
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Verify registry credentials
        run: |
          test -n "${NODE_AUTH_TOKEN}"
          test -n "${CARGO_REGISTRY_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: python -m pip install --upgrade build
      - run: python -m build sdk/python --outdir dist/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
      - run: npm publish --access public --provenance
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: cargo publish -p cortex-sdk --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
