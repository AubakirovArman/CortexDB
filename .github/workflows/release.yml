name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-evidence:
    name: Release evidence gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: python -m pip install --upgrade pip setuptools wheel build

      - name: Run release gates and evidence bundle
        run: |
          safe_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          make beta-release-check
          make docs-site-check
          make security-check
          make release-check \
            BINARY_RELEASE_VERSION="$GITHUB_REF_NAME" \
            BINARY_RELEASE_ID="cortexdb-${safe_tag}-local" \
            BINARY_RELEASE_ARCHIVE="target/release-artifacts/cortexdb-${safe_tag}-local.tar.gz"

      - name: Upload release evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-bundle
          if-no-files-found: warn
          retention-days: 90
          path: |
            target/release-evidence-bundle/**
            target/release-artifact-manifest/**
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.sha256
            target/production-evidence/**
            target/evidence-artifact-retention/**

  release-ann-baseline:
    name: Publish ANN release baseline
    needs: release-evidence
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Prepare release names
        run: |
          tag="${GITHUB_REF_NAME}"
          safe_tag="$(printf '%s' "$tag" | tr -c 'A-Za-z0-9._-' '-')"
          baseline_id="${safe_tag}-ann-smoke"
          demo_baseline_id="${safe_tag}-ann-demo-domain"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ANN_RELEASE_NOTES=target/release-notes.md" >> "$GITHUB_ENV"
          echo "ANN_BASELINE_ID=$baseline_id" >> "$GITHUB_ENV"
          echo "ANN_BASELINE_ARCHIVE=target/ann/release-baselines/${baseline_id}.tar.gz" >> "$GITHUB_ENV"
          echo "ANN_DEMO_DOMAIN_BASELINE_ID=$demo_baseline_id" >> "$GITHUB_ENV"
          echo "ANN_DEMO_DOMAIN_BASELINE_ARCHIVE=target/ann/demo-domain-corpus/release-baselines/${demo_baseline_id}.tar.gz" >> "$GITHUB_ENV"

      - name: Build ANN baseline package
        run: |
          make ann-corpus-run-smoke ANN_CORPUS_RUN_ID="$ANN_BASELINE_ID"
          make ann-publish-baseline ANN_BASELINE_RUN_ID="$ANN_BASELINE_ID" ANN_BASELINE_ID="$ANN_BASELINE_ID"
          make ann-package-baseline ANN_BASELINE_ID="$ANN_BASELINE_ID" ANN_BASELINE_ARCHIVE="$ANN_BASELINE_ARCHIVE"
          make ann-validate-baseline-package ANN_BASELINE_ARCHIVE="$ANN_BASELINE_ARCHIVE"
          make ann-demo-domain-package-baseline ANN_DEMO_DOMAIN_RUN_ID="$ANN_DEMO_DOMAIN_BASELINE_ID" ANN_DEMO_DOMAIN_BASELINE_ID="$ANN_DEMO_DOMAIN_BASELINE_ID" ANN_DEMO_DOMAIN_BASELINE_ARCHIVE="$ANN_DEMO_DOMAIN_BASELINE_ARCHIVE"
          make ann-demo-domain-validate-baseline-package ANN_DEMO_DOMAIN_BASELINE_ARCHIVE="$ANN_DEMO_DOMAIN_BASELINE_ARCHIVE"

      - name: Prepare release notes
        run: |
          mkdir -p target
          notes_path="docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          if [ -f "$notes_path" ]; then
            cp "$notes_path" "$ANN_RELEASE_NOTES"
          else
            {
              echo "# CortexDB ${RELEASE_TAG}"
              echo
              echo "Automated release for ${RELEASE_TAG}."
              echo
              echo "Attached ANN baseline package:"
              echo
              echo "- \`${ANN_BASELINE_ARCHIVE##*/}\`"
              echo "- \`${ANN_DEMO_DOMAIN_BASELINE_ARCHIVE##*/}\`"
            } > "$ANN_RELEASE_NOTES"
          fi

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ANN_BASELINE_ARCHIVE" --clobber
            gh release upload "$RELEASE_TAG" "$ANN_DEMO_DOMAIN_BASELINE_ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "$ANN_BASELINE_ARCHIVE" "$ANN_DEMO_DOMAIN_BASELINE_ARCHIVE" \
              --title "$RELEASE_TAG" \
              --notes-file "$ANN_RELEASE_NOTES"
          fi

      - name: Upload workflow artifact copy
        uses: actions/upload-artifact@v7
        with:
          name: ann-release-baseline-package
          path: |
            target/ann/release-baselines/*.tar.gz
            target/ann/demo-domain-corpus/release-baselines/*.tar.gz

  release-container:
    name: Publish GHCR Docker image
    needs: release-ann-baseline
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare image names
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build container image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            -t "${GHCR_IMAGE}:${RELEASE_TAG}" \
            -t "${GHCR_IMAGE}:latest" \
            .

      - name: Smoke image CLI
        run: docker run --rm --entrypoint cortexdb "${GHCR_IMAGE}:${RELEASE_TAG}" --version

      - name: Push container image
        run: |
          docker push "${GHCR_IMAGE}:${RELEASE_TAG}"
          docker push "${GHCR_IMAGE}:latest"

  release-binaries:
    name: Publish binary release artifacts
    needs: release-ann-baseline
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-13
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build and validate binary archive
        run: |
          tag="${GITHUB_REF_NAME}"
          safe_tag="$(printf '%s' "$tag" | tr -c 'A-Za-z0-9._-' '-')"
          platform="${{ matrix.platform }}"
          package_id="cortexdb-${safe_tag}-${platform}"
          archive="target/release-artifacts/${package_id}.tar.gz"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "BINARY_RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          make binary-release-check \
            BINARY_RELEASE_ID="$package_id" \
            BINARY_RELEASE_PLATFORM="$platform" \
            BINARY_RELEASE_VERSION="$tag" \
            BINARY_RELEASE_ARCHIVE="$archive"

      - name: Publish GitHub Release binary asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "$BINARY_RELEASE_ARCHIVE" "${BINARY_RELEASE_ARCHIVE}.sha256" --clobber

      - name: Upload workflow artifact copy
        uses: actions/upload-artifact@v7
        with:
          name: cortexdb-binaries-${{ matrix.platform }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.sha256
