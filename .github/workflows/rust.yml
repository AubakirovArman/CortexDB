name: Rust

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo check --workspace
      - run: cargo test --workspace --all-features
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make crash-fault-check
        if: matrix.toolchain == 'stable'
      - name: Upload crash/fault evidence
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-fault-evidence
          if-no-files-found: warn
          path: |
            target/crash-fault/report.json
            target/crash-fault/*.log
      - run: make backup-offsite-check
        if: matrix.toolchain == 'stable'
      - name: Upload backup offsite evidence
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-offsite-evidence
          if-no-files-found: warn
          path: target/backup-offsite/report.json
      - run: make chaos-restart-check
        if: matrix.toolchain == 'stable'
      - name: Upload chaos restart evidence
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-restart-evidence
          if-no-files-found: warn
          path: |
            target/chaos-restart/report.json
            target/chaos-restart/server.log
      - run: make replication-partition-check
        if: matrix.toolchain == 'stable'
      - name: Upload replication partition evidence
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: replication-partition-evidence
          if-no-files-found: warn
          path: |
            target/replication-partition/report.json
            target/replication-partition/*.log
      - run: make replication-lifecycle-check
        if: matrix.toolchain == 'stable'
      - name: Upload replication lifecycle evidence
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: replication-lifecycle-evidence
          if-no-files-found: warn
          path: |
            target/replication-lifecycle/report.json
            target/replication-lifecycle/*.log
      - run: make dashboard-check
        if: matrix.toolchain == 'stable'
      - run: make dashboard-standalone-check
        if: matrix.toolchain == 'stable'
      - run: make dashboard-standalone-smoke
        if: matrix.toolchain == 'stable'
      - run: make dashboard-release-check
        if: matrix.toolchain == 'stable'
      - name: Upload dashboard release package
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-release-package
          if-no-files-found: warn
          path: target/dashboard/*.tar.gz
      - uses: actions/setup-node@v6
        if: matrix.toolchain == 'stable'
        with:
          node-version: 24
          cache: npm
      - run: make dashboard-smoke
        if: matrix.toolchain == 'stable'
      - run: make dashboard-screenshots
        if: matrix.toolchain == 'stable'
      - name: Upload dashboard screenshots
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshots
          if-no-files-found: warn
          path: |
            target/dashboard/*.png
            target/dashboard/*.json
      - name: Generate ANN regression reports
        if: matrix.toolchain == 'stable'
        id: ann_reports
        continue-on-error: true
        run: |
          make ann-fixture-report
          make ann-drift-report
          make ann-external-report
          make ann-metric-matrix-report
          make ann-corpus-smoke-report
          make ann-domain-corpus-report
          make ann-corpus-run-smoke
          make ann-demo-domain-corpus-run
          make ann-demo-domain-package-baseline
          make ann-demo-domain-validate-baseline-package
          make ann-publish-baseline
          make ann-package-baseline
          make ann-validate-baseline-package
          make ann-compare-baseline-bundle
      - name: Upload ANN regression reports
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ann-regression-reports
          if-no-files-found: warn
          path: |
            target/ann/ann_fixture_report.json
            target/ann/ann_drift_report.json
            target/ann/ann_external_fixture_report.json
            target/ann/ann_metric_matrix_report.json
            target/ann/ann_corpus_report.json
            target/ann/ann_domain_corpus_report.json
            target/ann/corpus-runs/**
            target/ann/demo-domain-corpus/**
            target/ann/release-baselines/**
      - name: Upload ANN release baseline package
        if: matrix.toolchain == 'stable' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ann-release-baseline-package
          if-no-files-found: warn
          path: target/ann/release-baselines/*.tar.gz
      - name: Fail on ANN report regression
        if: matrix.toolchain == 'stable' && steps.ann_reports.outcome == 'failure'
        run: exit 1
