name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: -D warnings

jobs:
  pr:
    name: PR lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - run: make file-size-check
      - run: make docs-link-check

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - run: cargo check --workspace
      - run: cargo test --workspace --all-features
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: make live-integration-examples-check
      - run: make migration-policy-check
      - run: make storage-format-change-note-check

      - run: make enterprise-rag-bench-retrieval-quality-fixture-check
      - run: make enterprise-rag-bench-hybrid-parity-fixture-check
      - run: make enterprise-rag-bench-query-understanding-lift-check
