name: ANN Investment Projects Real Embedding

on:
  workflow_dispatch:
    inputs:
      run_id_prefix:
        description: "Prefix for the archived run id"
        required: true
        default: "investment-projects"
        type: string
      embedding_model:
        description: "Embedding model id sent to the configured endpoint"
        required: true
        default: "BAAI/bge-m3"
        type: string
      slo_profile:
        description: "ANN/HNSW workload SLO profile"
        required: true
        default: "balanced"
        type: choice
        options: ["fast", "balanced", "semantic", "audit"]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INVESTMENT_PROJECTS_SOURCE_ROOT: examples/real_domains/investment_projects/corpus
  INVESTMENT_PROJECTS_QUERIES: examples/real_domains/investment_projects/queries/queries.jsonl
  CORTEXDB_EMBEDDING_URL: ${{ secrets.CORTEXDB_EMBEDDING_URL }}
  CORTEXDB_EMBEDDING_API_KEY: ${{ secrets.CORTEXDB_EMBEDDING_API_KEY }}

jobs:
  investment-projects-real-embedding:
    name: Run investment_projects real embedding ANN gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Resolve run configuration
        env:
          INPUT_RUN_ID_PREFIX: ${{ github.event.inputs.run_id_prefix }}
          INPUT_EMBEDDING_MODEL: ${{ github.event.inputs.embedding_model }}
          INPUT_SLO_PROFILE: ${{ github.event.inputs.slo_profile }}
        run: |
          set -euo pipefail
          run_id_prefix="${INPUT_RUN_ID_PREFIX:-investment-projects}"
          embedding_model="${INPUT_EMBEDDING_MODEL:-BAAI/bge-m3}"
          slo_profile="${INPUT_SLO_PROFILE:-balanced}"
          run_id="${run_id_prefix}-${GITHUB_RUN_ID}"
          {
            echo "ANN_REAL_EMBEDDING_RUN_ID=$run_id"
            echo "ANN_REAL_EMBEDDING_BASELINE_ID=$run_id"
            echo "CORTEXDB_EMBEDDING_MODEL=$embedding_model"
            echo "ANN_REAL_EMBEDDING_SLO_PROFILE=$slo_profile"
          } >> "$GITHUB_ENV"

      - name: Check embedding secrets
        run: |
          set -euo pipefail
          if [ -z "${CORTEXDB_EMBEDDING_URL:-}" ]; then
            echo "Set repository secret CORTEXDB_EMBEDDING_URL" >&2
            exit 2
          fi
          if [ -z "${CORTEXDB_EMBEDDING_API_KEY:-}" ]; then
            echo "Set repository secret CORTEXDB_EMBEDDING_API_KEY" >&2
            exit 2
          fi

      - name: Validate checked-in investment_projects corpus
        run: |
          set -euo pipefail
          cd examples/real_domains/investment_projects
          python3 scripts/validate_corpus.py
          python3 scripts/validate_ground_truth.py

      - name: Run readiness gate
        run: |
          set -euo pipefail
          make ann-real-embedding-readiness \
            ANN_REAL_EMBEDDING_SOURCE_ROOT="$INVESTMENT_PROJECTS_SOURCE_ROOT" \
            ANN_REAL_EMBEDDING_QUERIES="$INVESTMENT_PROJECTS_QUERIES" \
            ANN_REAL_EMBEDDING_REQUIRE_API_KEY=true \
            ANN_REAL_EMBEDDING_SLO_PROFILE="$ANN_REAL_EMBEDDING_SLO_PROFILE" \
            ANN_REAL_EMBEDDING_READINESS_REPORT=target/ann/real-embedding/investment_projects_readiness.json

      - name: Run benchmark
        run: |
          set -euo pipefail
          make ann-real-embedding-benchmark \
            ANN_REAL_EMBEDDING_SOURCE_ROOT="$INVESTMENT_PROJECTS_SOURCE_ROOT" \
            ANN_REAL_EMBEDDING_QUERIES="$INVESTMENT_PROJECTS_QUERIES" \
            ANN_REAL_EMBEDDING_RUN_ID="$ANN_REAL_EMBEDDING_RUN_ID" \
            ANN_REAL_EMBEDDING_REQUIRE_API_KEY=true \
            ANN_REAL_EMBEDDING_SLO_PROFILE="$ANN_REAL_EMBEDDING_SLO_PROFILE" \
            ANN_REAL_EMBEDDING_READINESS_REPORT=target/ann/real-embedding/investment_projects_readiness.json \
            ANN_REAL_EMBEDDING_PREFLIGHT_REPORT=target/ann/real-embedding/investment_projects_preflight.json

      - name: Package and validate baseline
        run: |
          set -euo pipefail
          make ann-real-embedding-history-regression-check \
            ANN_REAL_EMBEDDING_RUN_ID="$ANN_REAL_EMBEDDING_RUN_ID"
          make ann-real-embedding-package-baseline \
            ANN_REAL_EMBEDDING_RUN_ID="$ANN_REAL_EMBEDDING_RUN_ID" \
            ANN_REAL_EMBEDDING_BASELINE_ID="$ANN_REAL_EMBEDDING_BASELINE_ID"
          make ann-real-embedding-validate-baseline-package \
            ANN_REAL_EMBEDDING_BASELINE_ARCHIVE="target/ann/real-embedding/release-baselines/${ANN_REAL_EMBEDDING_BASELINE_ID}.tar.gz"

      - name: Upload investment_projects real embedding evidence
        uses: actions/upload-artifact@v7
        with:
          name: ann-investment-projects-real-embedding-${{ github.run_id }}
          if-no-files-found: error
          path: |
            target/ann/real-embedding/investment_projects_readiness.json
            target/ann/real-embedding/investment_projects_preflight.json
            target/ann/real-embedding/export/**
            target/ann/real-embedding/runs/**
            target/ann/real-embedding/release-baselines/**
