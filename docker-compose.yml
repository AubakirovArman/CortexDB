version: "3.8"

services:
  cortexdb:
    build: .
    container_name: cortexdb
    ports:
      - "8181:8181"
    volumes:
      - cortexdb-data:/data
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8181/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  cortexdb-data:
