[project]
name = "cortexdb-sdk"
version = "0.2.0b2"
description = "Beta CortexDB HTTP client"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CortexDB" }]
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/AubakirovArman/CortexDB"
Repository = "https://github.com/AubakirovArman/CortexDB"
Issues = "https://github.com/AubakirovArman/CortexDB/issues"

[tool.setuptools]
py-modules = ["cortexdb_client"]
packages = ["_cortexdb_client", "_cortexdb_client.generated", "_cortexdb_client.model_types"]

[tool.setuptools.package-data]
_cortexdb_client = ["py.typed"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
